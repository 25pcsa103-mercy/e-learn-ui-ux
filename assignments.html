
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    header { background: url('https://images.unsplash.com/photo-1523580494863-6f3031224c94?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat; color: white; padding: 60px 20px; text-align: center; }
    header h1 { font-size: 2.5rem; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
    .assignments { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 40px 20px; }
    .assignment-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
    .assignment-card img { width: 100%; height: 150px; object-fit: cover; }
    .assignment-content { padding: 15px; flex: 1; }
    .assignment-content h3 { margin-top: 0; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 10px; }
    .pending { background: #ffe0b2; color: #e65100; }
    .completed { background: #c8e6c9; color: #2e7d32; }
    button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <header>
    <h1>Assignments</h1>
  </header>

  <section class="assignments">
    <div class="assignment-card">
      <img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=600&q=80" alt="Assignment">
      <div class="assignment-content">
        <span class="badge pending">Pending</span>
        <h3>Build a Personal Portfolio</h3>
        <p><strong>Course:</strong> Web Development</p>
        <p><strong>Due Date:</strong> 2025-10-01</p>
        <button>Submit Assignment</button>
      </div>
    </div>

    <div class="assignment-card">
      <img src="https://images.pexels.com/photos/196645/pexels-photo-196645.jpeg" alt="Assignment">
      <div class="assignment-content">
        <span class="badge pending">Pending</span>
        <h3>Create a Wireframe</h3>
        <p><strong>Course:</strong> UI/UX Design</p>
        <p><strong>Due Date:</strong> 2025-10-05</p>
        <button>Submit Assignment</button>
      </div>
    </div>

    <div class="assignment-card">
      <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=600&q=80" alt="Assignment">
      <div class="assignment-content">
        <span class="badge completed">Completed</span>
        <h3>Responsive Landing Page</h3>
        <p><strong>Course:</strong> Frontend Development</p>
        <p><strong>Due Date:</strong> 2025-09-20</p>
        <button disabled>Submitted</button>
      </div>
    </div>
  </section>
</body>
</html>
